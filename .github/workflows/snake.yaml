name: Generate Snake Animation

on:
  # Tourne tous les jours a minuit UTC
  schedule:
    - cron: "0 0 * * *"
  # Permet de lancer manuellement depuis l'onglet Actions
  workflow_dispatch:
  # Regenere a chaque push sur main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: MaxAuMax
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#8b5cf6&color_dots=#1a103d,#5b21b6,#7c4dff,#a78bfa,#c4b5fd

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
